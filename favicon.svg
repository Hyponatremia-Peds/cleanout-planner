<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#141413"/>
  <!-- wings: three feathers each, flattened to sit above the snakes' heads -->
  <g fill="#FAF9F6" transform="translate(0 -1.5) scale(1 .7)">
    <path d="M30 15.5 C24 11 16 8 6 6.5 C9 9.5 11 10.5 13.5 11.8 C10.5 12 8.5 12.8 6.5 14.2 C10.5 15 13.5 15.2 16.5 15.6 C13.5 16.4 11.5 17.4 9.5 19 C16 19.6 23 19.6 30 20.5 Z"/>
    <path d="M34 15.5 C40 11 48 8 58 6.5 C55 9.5 53 10.5 50.5 11.8 C53.5 12 55.5 12.8 57.5 14.2 C53.5 15 50.5 15.2 47.5 15.6 C50.5 16.4 52.5 17.4 54.5 19 C48 19.6 41 19.6 34 20.5 Z"/>
  </g>
  <!-- staff -->
  <circle cx="32" cy="6.5" r="3.2" fill="#FAF9F6"/>
  <rect x="30.4" y="8" width="3.2" height="52" rx="1.6" fill="#FAF9F6"/>
  <!-- the two baby snakes, moved down a little to make room for the wings -->
  <g transform="translate(3.2 8) scale(.9)">
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- snake B (right head, behind) -->
      <path d="M43 17 C49 19 51 24 44 27 C37 30 22 29 21 35 C20 41 43 40 43 46 C43 52 31 53 31 59" stroke="#141413" stroke-width="7.6"/>
      <path d="M43 17 C49 19 51 24 44 27 C37 30 22 29 21 35 C20 41 43 40 43 46 C43 52 31 53 31 59" stroke="#FAF9F6" stroke-width="4.6"/>
      <!-- snake A (left head, in front) -->
      <path d="M21 17 C15 19 13 24 20 27 C27 30 42 29 43 35 C44 41 21 40 21 46 C21 52 33 53 33 59" stroke="#141413" stroke-width="7.6"/>
      <path d="M21 17 C15 19 13 24 20 27 C27 30 42 29 43 35 C44 41 21 40 21 46 C21 52 33 53 33 59" stroke="#FAF9F6" stroke-width="4.6"/>
    </g>
    <!-- big round baby heads facing each other across the staff -->
    <g fill="#FAF9F6" stroke="#141413" stroke-width="1.2">
      <ellipse cx="24.5" cy="15" rx="5.2" ry="4.4" transform="rotate(8 24.5 15)"/>
      <ellipse cx="39.5" cy="15" rx="5.2" ry="4.4" transform="rotate(-8 39.5 15)"/>
    </g>
    <g fill="#141413"><circle cx="26.6" cy="13.9" r="1.6"/><circle cx="37.4" cy="13.9" r="1.6"/></g>
    <g fill="#FAF9F6"><circle cx="27.1" cy="13.3" r=".5"/><circle cx="37.9" cy="13.3" r=".5"/></g>
    <g fill="none" stroke="#141413" stroke-width=".8" stroke-linecap="round">
      <path d="M26.3 17.2 Q27.8 18.2 29 17"/><path d="M37.7 17.2 Q36.2 18.2 35 17"/>
    </g>
  </g>
</svg>
